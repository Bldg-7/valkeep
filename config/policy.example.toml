# 외부 연결 없이 --check-config / --acl-plan으로 확인할 수 있다.
policy_version = 2
audit_path = "../valkeep.router.audit.jsonl"

[[targets]]
id = "catalog-cache"
environment = "local"
host = "127.0.0.1"
port = 6379
username = "valkeep_catalog_reader"
password_env = "VALKEEP_CATALOG_PASSWORD"
tls = false
readonly_acl_confirmed = true
allowed_prefixes = ["example:catalog:"]
audit_path = "../valkeep.catalog.audit.jsonl"
preset = "production-safe"
# 기본 프리셋은 메타데이터·연결 점검만 허용한다.
# 필요한 경우에만 다음 기능을 true로 바꾼다.
[targets.features]
value_preview = false
key_discovery = false

[[targets]]
id = "job-queue"
environment = "local"
host = "127.0.0.1"
port = 6380
username = "valkeep_queue_reader"
password_env = "VALKEEP_QUEUE_PASSWORD"
tls = false
readonly_acl_confirmed = true
allowed_prefixes = ["example:jobs:"]
audit_path = "../valkeep.queue.audit.jsonl"
preset = "production-safe"

[targets.limits]
requests_per_second = 0.5
