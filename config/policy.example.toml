# 실제 연결 없이 형식 검증이 가능한 예시다.
# 사용 전 대상·계정·키 범위를 검토하고 전용 ACL을 별도로 구성해야 한다.
policy_version = 1
allowed_prefixes = ["example:cache:"]
allowed_keys = []
tools = ["inspect_key", "list_length"]
audit_path = "../valkeep.audit.jsonl"

[target]
id = "local-diagnostics"
environment = "local"
host = "127.0.0.1"
port = 6379
database = 0
username = "valkeep_reader"
password_env = "VALKEEP_REDIS_PASSWORD"
tls = false
# 운영자가 ACL을 검토했다는 선언이며 자동 검증 결과가 아니다.
readonly_acl_confirmed = true

[limits]
max_inflight = 1
requests_per_second = 1.0
burst = 1
max_request_bytes = 8192
max_response_bytes = 8192
max_upstream_frame_bytes = 1048576
max_key_bytes = 512
response_timeout_seconds = 3.0
cleanup_timeout_seconds = 5.0
startup_timeout_seconds = 15.0
